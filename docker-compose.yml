# Paperless-ngx for document management. The StillOpen app itself runs on the host (python manage.py runserver)
# so it can reach career-ops and Node; Paperless needs no access to either.
#
#   1. cp .env.example .env   and fill PAPERLESS_ADMIN_USER / PAPERLESS_ADMIN_PASSWORD / PAPERLESS_SECRET_KEY
#   2. docker compose up -d
#   3. open http://127.0.0.1:8010, create an API token (profile menu > My Profile), paste it in the Django admin
#      under Site configuration (or set PAPERLESS_TOKEN in .env)
#
# Optional profile "web" also runs StillOpen in a container behind nginx on http://127.0.0.1:8080
#   docker compose --profile web up -d --build
services:
  broker:
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    image: redis:7
    restart: unless-stopped
    volumes:
      - paperless_redis:/data

  paperless:
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    image: ghcr.io/paperless-ngx/paperless-ngx:latest
    restart: unless-stopped
    depends_on:
      - broker
    ports:
      - "127.0.0.1:8010:8000"
    volumes:
      - paperless_data:/usr/src/paperless/data
      - paperless_media:/usr/src/paperless/media
      - ./paperless/export:/usr/src/paperless/export
      - ./paperless/consume:/usr/src/paperless/consume
    environment:
      PAPERLESS_REDIS: redis://broker:6379
      PAPERLESS_URL: http://127.0.0.1:8010
      PAPERLESS_SECRET_KEY: ${PAPERLESS_SECRET_KEY:?set PAPERLESS_SECRET_KEY in .env}
      PAPERLESS_ADMIN_USER: ${PAPERLESS_ADMIN_USER:?set PAPERLESS_ADMIN_USER in .env}
      PAPERLESS_ADMIN_PASSWORD: ${PAPERLESS_ADMIN_PASSWORD:?set PAPERLESS_ADMIN_PASSWORD in .env}
      PAPERLESS_TIME_ZONE: Asia/Dhaka
      PAPERLESS_OCR_LANGUAGE: eng

  db:
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    profiles: ["web"]
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: stillopen
      POSTGRES_USER: stillopen
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - stillopen_pg:/var/lib/postgresql/data

  web:
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    profiles: ["web"]
    build: .
    restart: unless-stopped
    depends_on:
      - db
    env_file: .env
    environment:
      DJANGO_DEBUG: "0"
      DATABASE_URL: postgres://stillopen:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/stillopen
      STILLOPEN_MEDIA: /data/media
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
      DJANGO_BEHIND_PROXY: "1"
      # Set DJANGO_HTTPS=1 once a TLS-terminating proxy is in front (required for secure cookies on the public internet).
      DJANGO_HTTPS: ${DJANGO_HTTPS:-0}
      PAPERLESS_URL: http://paperless:8000
    volumes:
      - stillopen_data:/data

  nginx:
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    profiles: ["web"]
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - web
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  paperless_data:
  paperless_media:
  paperless_redis:
  stillopen_data:
  stillopen_pg:

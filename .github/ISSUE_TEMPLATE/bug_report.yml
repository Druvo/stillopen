name: Bug report
description: Something does not work the way it should
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping. **Security problems: please do not file them here.** Use the Security tab > "Report a vulnerability" (see SECURITY.md).
        Remove personal data (CV text, emails, tokens) from anything you paste.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Sign in\n2. Open the dashboard\n3. ..."
  - type: dropdown
    id: how
    attributes:
      label: How do you run StillOpen?
      options: [Locally with Python, Docker / docker compose, A server (gunicorn or similar), Not sure]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `git rev-parse --short HEAD`
  - type: textarea
    id: logs
    attributes:
      label: Logs or error text
      render: text

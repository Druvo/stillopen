name: Project site

# Publishes site/ (plain HTML, CSS and JS, nothing fetched from elsewhere) to GitHub Pages when it changes on main.
# One-time owner step: Settings > Pages > Source: "GitHub Actions".
#
# Pinned actions (all long released, major tags): actions/checkout v4.2.2, actions/configure-pages v5, actions/upload-pages-artifact v3,
# actions/deploy-pages v4.

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4

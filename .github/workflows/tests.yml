name: Tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        # The MCP server and the optional Claude Agent SDK provider both have tests, so both optional sets are installed.
        run: python -m pip install -r requirements-mcp.txt -r requirements-ai.txt

      - name: No model change without a migration
        run: python manage.py makemigrations --check --dry-run

      - name: Run the test suite
        env:
          DJANGO_SECRET_KEY: ci-only-not-a-secret
        run: python manage.py test --noinput

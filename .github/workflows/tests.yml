name: Tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        # The MCP server and the optional Claude Agent SDK provider both have tests, so both optional sets are installed.
        run: python -m pip install -r requirements-mcp.txt -r requirements-ai.txt

      - name: No model change without a migration
        run: python manage.py makemigrations --check --dry-run

      - name: Run the test suite
        env:
          DJANGO_SECRET_KEY: ci-only-not-a-secret
        run: python manage.py test --noinput

  test-postgres:
    # The shared-service setup runs on PostgreSQL, so the same suite runs there too.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: stillopen
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: stillopen
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stillopen"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-hosting.txt -r requirements-mcp.txt -r requirements-ai.txt

      - name: Run the test suite on PostgreSQL
        env:
          DJANGO_SECRET_KEY: ci-only-not-a-secret
          DATABASE_URL: postgres://stillopen:ci-only@127.0.0.1:5432/stillopen
        run: python manage.py test --noinput

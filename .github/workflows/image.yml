name: Container image

# Pull requests that touch the image: build it, never push.
# Version tags (v1.2.3; publishing a release creates one): build it and push it to GitHub's container registry as
# ghcr.io/<owner>/<repo> (tagged with the version, and "latest" for a stable one).

on:
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - deploy/docker-entrypoint.sh
      - requirements*.txt
      - frontend/package.json
      - frontend/pnpm-lock.yaml
      - .github/workflows/image.yml
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    # No push, no registry login: safe for pull requests from forks.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: docker/setup-buildx-action@v3.7.1
      - uses: docker/build-push-action@v6.9.0
        with:
          context: .
          push: false
          tags: stillopen:pr-check
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: docker/setup-qemu-action@v3.2.0
      - uses: docker/setup-buildx-action@v3.7.1
      - uses: docker/login-action@v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5.5.1
        with:
          # the action lower-cases the name, which the registry requires
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=tag
          labels: |
            org.opencontainers.image.title=StillOpen
      - uses: docker/build-push-action@v6.9.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

<!doctype html>
<html lang="en" data-bs-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ title }} · {{ config.site_title }}</title>
<link href="https://cdn.jsdelivr.net/npm/@tabler/core@1.7.0/dist/css/tabler.min.css" rel="stylesheet">
</head>
<body>
<div class="page">
  <div class="page-wrapper">
    <div class="page-body">
      <div class="container-tight py-4" style="max-width:680px">
        <p><a href="{% url 'landing' %}">&larr; {{ config.site_title }}</a></p>
        <h1 class="h2">{{ title }}</h1>
        {{ text|linebreaks }}
        <p class="text-secondary"><a href="{% url 'privacy' %}">Privacy</a> · <a href="{% url 'terms' %}">Terms</a></p>
      </div>
    </div>
  </div>
</div>
</body>
</html>

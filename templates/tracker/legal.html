{% load static %}
<!doctype html>
<html lang="en" data-bs-theme="{{ site_config.default_theme }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ title }} · {{ config.site_title }}</title>
<script src="{% static 'js/theme.js' %}?v={{ asset_v }}"></script>
<link href="{% static 'vendor/tabler/tabler.min.css' %}" rel="stylesheet">
<link href="{% static 'css/stillopen.css' %}?v={{ asset_v }}" rel="stylesheet">
</head>
<body>
<div class="page">
  <div class="page-wrapper">
    <div class="page-body">
      <div class="container-tight py-4" style="max-width:680px">
        <div class="d-flex justify-content-between align-items-center mb-4">
          <a class="so-brand" href="{% url 'landing' %}">{% include "tracker/_logo.html" with site_title=config.site_title %}<span>{{ config.site_title }}</span></a>
          <button type="button" class="so-theme" data-theme-toggle aria-label="Switch to dark mode" aria-pressed="false"><svg class="so-ic-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/></svg><svg class="so-ic-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
        </div>
        <h1 class="h2">{{ title }}</h1>
        {{ text|linebreaks }}
        <p class="text-secondary"><a href="{% url 'privacy' %}">Privacy</a> · <a href="{% url 'terms' %}">Terms</a></p>
      </div>
    </div>
  </div>
</div>
</body>
</html>

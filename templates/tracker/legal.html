<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ title }} · {{ config.site_title }}</title>
<style>
:root{--bg:#0f1218;--panel:#171b24;--line:#262c3a;--text:#e6e9f0;--muted:#8b93a7;--accent:#5b9dff}
@media (prefers-color-scheme:light){:root{--bg:#f5f6f9;--panel:#fff;--line:#dfe3ec;--text:#1a1f2b;--muted:#5d667a}}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.65 system-ui,Segoe UI,sans-serif}
main{max-width:680px;margin:0 auto;padding:32px 20px}
a{color:var(--accent)}
h1{font-size:26px}
.muted{color:var(--muted)}
</style>
</head>
<body>
<main>
  <p><a href="{% url 'landing' %}">&larr; {{ config.site_title }}</a></p>
  <h1>{{ title }}</h1>
  {{ text|linebreaks }}
  <p class="muted"><a href="{% url 'privacy' %}">Privacy</a> · <a href="{% url 'terms' %}">Terms</a></p>
</main>
</body>
</html>

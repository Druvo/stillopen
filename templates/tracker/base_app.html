<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}{% endblock %} · {{ config.site_title }}</title>
<style>
:root{--bg:#0f1218;--panel:#171b24;--line:#262c3a;--text:#e6e9f0;--muted:#8b93a7;--accent:#5b9dff;--ok:#3ecf8e;--warn:#f5b642;--bad:#f16565}
@media (prefers-color-scheme:light){:root{--bg:#f5f6f9;--panel:#fff;--line:#dfe3ec;--text:#1a1f2b;--muted:#5d667a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.55 system-ui,Segoe UI,sans-serif}
a{color:var(--accent)}
header.top{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:14px 20px;border-bottom:1px solid var(--line)}
header.top .brand{font-weight:700;font-size:16px;color:var(--text);text-decoration:none}
nav.menu{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.btn,button{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:6px 12px;font:inherit;cursor:pointer;text-decoration:none;display:inline-block}
.btn:hover,button:hover{border-color:var(--accent)}
.btn.primary,button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.btn.danger,button.danger{border-color:var(--bad);color:var(--bad)}
main{max-width:760px;margin:0 auto;padding:20px}
h1{font-size:22px;margin:0 0 4px}
h2{font-size:16px;margin:28px 0 8px}
.muted{color:var(--muted)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;margin:12px 0}
label{display:block;font-weight:600;margin:12px 0 4px}
input[type=text],input[type=url],input[type=number],input[type=date],input[type=password],select,textarea{width:100%;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font:inherit}
textarea{font-family:inherit}
input[type=checkbox]{margin-right:6px}
.helptext,.help{color:var(--muted);font-size:12.5px;display:block;margin-top:3px}
ul.errorlist{margin:4px 0;padding:0;list-style:none;color:var(--bad);font-size:13px}
.msg{border:1px solid var(--line);border-radius:8px;padding:8px 12px;margin:10px 0}
.msg.success{border-color:var(--ok)}
.msg.error{border-color:var(--bad);color:var(--bad)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.banner{border:1px solid var(--warn);border-radius:10px;padding:10px 14px;margin:12px 0}
table{width:100%;border-collapse:collapse}
td,th{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.pill{display:inline-block;border-radius:999px;padding:1px 9px;font-size:12px;border:1px solid var(--line);color:var(--muted)}
</style>
</head>
<body>
<header class="top">
  <a class="brand" href="{% url 'dashboard' %}">{{ config.site_title }}</a>
  <nav class="menu">
    <a class="btn" href="{% url 'dashboard' %}">Dashboard</a>
    <a class="btn" href="{% url 'add_job' %}">Add job</a>
    <a class="btn" href="{% url 'all_postings' %}">All postings</a>
    <a class="btn" href="{% url 'profile' %}">Profile</a>
    <a class="btn" href="{% url 'cv_list' %}">CVs</a>
    <a class="btn" href="{% url 'knowledge' %}">Documents</a>
    <a class="btn" href="{% url 'profile_ai' %}">AI settings</a>
    <form method="post" action="{% url 'account_logout' %}" style="display:inline">{% csrf_token %}<button type="submit">Sign out</button></form>
  </nav>
</header>
<main>
  {% for message in messages %}<div class="msg {{ message.tags }}">{{ message }}</div>{% endfor %}
  {% block content %}{% endblock %}
</main>
</body>
</html>

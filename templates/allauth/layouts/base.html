<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block head_title %}{% endblock %} · {{ site_config.site_title|default:"StillOpen" }}</title>
<style>
:root{--bg:#0f1218;--panel:#171b24;--line:#262c3a;--text:#e6e9f0;--muted:#8b93a7;--accent:#5b9dff;--bad:#f16565}
@media (prefers-color-scheme:light){:root{--bg:#f5f6f9;--panel:#fff;--line:#dfe3ec;--text:#1a1f2b;--muted:#5d667a}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--text);font:14px/1.5 system-ui,Segoe UI,sans-serif;padding:16px}
.box{width:100%;max-width:380px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:24px;display:grid;gap:14px}
h1{font-size:20px;margin:0}
a{color:var(--accent)}
.muted{color:var(--muted)}
label{display:block;margin-bottom:4px;font-weight:600}
input[type=text],input[type=password],input[type=email]{width:100%;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font:inherit}
button,.btn{width:100%;background:var(--accent);color:#fff;border:0;border-radius:8px;padding:9px 12px;font:inherit;font-weight:600;cursor:pointer;text-align:center;text-decoration:none;display:block}
button.alt{background:var(--panel);color:var(--text);border:1px solid var(--line)}
.msg{border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.msg.error{border-color:var(--bad);color:var(--bad)}
.err{color:var(--bad);font-size:13px}
.or{display:flex;align-items:center;gap:10px;color:var(--muted)}
.or:before,.or:after{content:"";flex:1;border-top:1px solid var(--line)}
form{display:grid;gap:12px;margin:0}
ul.errorlist{margin:0;padding:0;list-style:none;color:var(--bad);font-size:13px}
</style>
</head>
<body>
<div class="box">
  {% if user.is_authenticated %}<a href="{% url 'profile' %}" style="font-size:13px">&larr; Back to your profile</a>{% endif %}
  {% for message in messages %}<div class="msg {{ message.tags }}">{{ message }}</div>{% endfor %}
  {% block content %}{% endblock %}
</div>
</body>
</html>

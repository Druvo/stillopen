<!doctype html>
<html lang="en" data-bs-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block head_title %}{% endblock %} · {{ site_config.site_title|default:"StillOpen" }}</title>
<link href="https://cdn.jsdelivr.net/npm/@tabler/core@1.7.0/dist/css/tabler.min.css" rel="stylesheet">
</head>
<body class="d-flex flex-column">
<div class="page page-center">
  <div class="container container-tight py-4">
    {% if user.is_authenticated %}<p class="mb-3"><a href="{% url 'profile' %}">&larr; Back to your profile</a></p>{% endif %}
    {% for message in messages %}<div class="alert {% if message.tags == 'error' %}alert-danger{% else %}alert-success{% endif %}">{{ message }}</div>{% endfor %}
    <div class="card card-md">
      <div class="card-body">
        {% block content %}{% endblock %}
      </div>
    </div>
  </div>
</div>
</body>
</html>

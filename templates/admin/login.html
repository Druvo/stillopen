{% extends "admin/login.html" %}
{% load socialaccount %}
{% block content %}
{% get_providers as providers %}
{% if google_login_on and providers %}
  <form method="post" action="{% provider_login_url 'google' process='login' next='/admin/' %}" style="margin-bottom:12px">
    {% csrf_token %}
    <div class="submit-row"><input type="submit" value="Continue with Google"></div>
  </form>
{% endif %}
{{ block.super }}
{% endblock %}
